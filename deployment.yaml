apiVersion: apps/v1
kind: Deployment

metadata:
  name: weatherapp-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: weatherapp

  template:
    metadata:
      labels:
        app: weatherapp

    spec:
      containers:
      - name: weatherapp
        image: weatherapp:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 8000